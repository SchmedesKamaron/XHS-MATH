<html style="margin:0;padding:0;">
<div style="background-color:transparent;box-sizing:border-box;">
  <div style="font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif;color:#1A1B1C;max-width:820px;margin:0 auto;">
    <!-- 标题 -->
    <div style="font-size:16px;font-weight:600;margin:0 0 4px;">亚里士多德之轮：外圈真滚动，内圈在打滑</div>
    <div style="font-size:12.5px;color:#6B7280;margin-bottom:12px;">示意（R=60, r=34），展示几何关系，非精确测量</div>

    <!-- 上：滚动前后两轮对比 -->
    <svg viewBox="0 0 800 252" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;">
      <!-- Γ2 辅助线（与内圆相切） -->
      <line x1="55" y1="207" x2="745" y2="207" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="58" y="199" font-size="11.5" fill="#6B7280">Γ₂（内圆相切辅助线，非真实接触面）</text>

      <!-- 地面 Γ1 -->
      <line x1="40" y1="234" x2="760" y2="234" stroke="#555" stroke-width="2"/>
      <text x="58" y="249" font-size="11.5" fill="#555">Γ₁（地面）</text>

      <!-- 圆心位移箭头（轮子上方） -->
      <line x1="170" y1="92" x2="547" y2="92" stroke="#1A1B1C" stroke-width="1.5"/>
      <polygon points="547,92 538,87 538,97" fill="#1A1B1C"/>
      <polygon points="170,92 179,87 179,97" fill="#1A1B1C"/>
      <text x="358" y="78" font-size="13" font-weight="600" text-anchor="middle" fill="#1A1B1C">圆心水平位移 = 2πR（车前进距离）</text>

      <!-- 起始轮：圆心(170,175) -->
      <circle cx="170" cy="175" r="60" fill="none" stroke="#9BBBF4" stroke-width="3"/>
      <circle cx="170" cy="175" r="34" fill="none" stroke="#F4B393" stroke-width="3"/>
      <circle cx="170" cy="175" r="3" fill="#1A1B1C"/>
      <text x="170" y="162" font-size="11" text-anchor="middle" fill="#9BBBF4" font-weight="600">外圈 R</text>
      <text x="170" y="186" font-size="11" text-anchor="middle" fill="#F4B393" font-weight="600">内圈 r</text>
      <!-- 辐条到接触点 -->
      <line x1="170" y1="175" x2="170" y2="234" stroke="#9BBBF4" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="170" y1="175" x2="170" y2="207" stroke="#F4B393" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="170" cy="234" r="4" fill="#9BBBF4"/>
      <circle cx="170" cy="207" r="4" fill="#F4B393"/>
      <text x="170" y="270" font-size="11" text-anchor="middle" fill="#9BBBF4">接触点速度 = 0（纯滚动✓）</text>
      <text x="170" y="284" font-size="11" text-anchor="middle" fill="#F4B393">接触点速度 ≠ 0（打滑✗）</text>

      <!-- 结束轮：圆心(547,175)，位移2πR -->
      <circle cx="547" cy="175" r="60" fill="none" stroke="#9BBBF4" stroke-width="3"/>
      <circle cx="547" cy="175" r="34" fill="none" stroke="#F4B393" stroke-width="3"/>
      <circle cx="547" cy="175" r="3" fill="#1A1B1C"/>
      <line x1="547" y1="175" x2="547" y2="234" stroke="#9BBBF4" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="547" y1="175" x2="547" y2="207" stroke="#F4B393" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="547" cy="234" r="4" fill="#9BBBF4"/>
      <circle cx="547" cy="207" r="4" fill="#F4B393"/>

      <!-- 地面上的位移标注 -->
      <line x1="170" y1="234" x2="547" y2="234" stroke="#9BBBF4" stroke-width="1.5"/>
      <text x="358" y="224" font-size="12" font-weight="600" text-anchor="middle" fill="#9BBBF4">地面上摊开的弧长 = 2πR</text>
    </svg>

    <!-- 下：周长/滑移对照 -->
    <svg viewBox="0 0 800 190" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-top:4px;">
      <!-- 距离轴 -->
      <line x1="110" y1="150" x2="720" y2="150" stroke="#999" stroke-width="1"/>
      <polygon points="720,150 710,145 710,155" fill="#999"/>

      <!-- 外圈整条 -->
      <rect x="110" y="40" width="610" height="26" rx="6" fill="#9BBBF4"/>
      <text x="110" y="84" font-size="12" font-weight="600" fill="#1A1B1C">外圈：无滑滚动，滚出整段 2πR，与圆心位移一致 ✓</text>

      <!-- 内圈段 + 滑移段 -->
      <rect x="110" y="100" width="366" height="26" rx="6" fill="#F4B393"/>
      <rect x="476" y="100" width="244" height="26" rx="6" fill="#EA6668" opacity="0.35"/>
      <text x="110" y="144" font-size="12" fill="#1A1B1C">
        内圈若纯滚动，只需 2πr <tspan font-weight="600" fill="#F4B393">（≈0.6·2πR）</tspan>
        <tspan font-weight="600" fill="#C0392B">　·　滑移量 = 2π(R−r)</tspan>
      </text>

      <!-- 轴刻度 -->
      <line x1="476" y1="144" x2="476" y2="150" stroke="#666" stroke-width="1"/>
      <line x1="720" y1="144" x2="720" y2="150" stroke="#666" stroke-width="1"/>
      <text x="110" y="172" font-size="11" fill="#666">0</text>
      <text x="476" y="172" font-size="11" fill="#666">2πr（内圈周长）</text>
      <text x="720" y="172" font-size="11" fill="#666" text-anchor="end">2πR（实际前进距离）</text>
    </svg>

    <!-- 结论框 -->
    <div style="margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(0,0,0,0.08);background:rgba(155,187,244,0.12);box-sizing:border-box;">
      <div style="font-size:13.5px;line-height:1.6;">
        <b>结论：</b>外圈压地面、真滚动，走 <b>2πR</b>；内圈只是被同一根轴拖行，同时转了一圈，但它在 Γ₂ 上<b>打滑</b>了 <b>2π(R−r)</b>。所以「内圈也走 2πr」的前提根本不成立 —— 矛盾消失。
      </div>
    </div>
  </div>
</div>
</html>
